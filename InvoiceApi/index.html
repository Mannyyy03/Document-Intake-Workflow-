<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice Database</title>
<style>
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --text: #1d2330; --muted: #5d6677;
    --line: #dfe3ea; --accent: #1f5fbf; --accent-soft: #e6eefb;
    --bad: #a3321f; --bad-soft: #fbeae6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --surface: #1c2028; --text: #e6e9ef; --muted: #98a1b3;
      --line: #2e3440; --accent: #7aa7ee; --accent-soft: #23304a;
      --bad: #f0a091; --bad-soft: #3a2420;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1050px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 650; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  button, select, input {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stats { display: flex; gap: 12px; margin: 22px 0 18px; flex-wrap: wrap; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; min-width: 150px; }
  .stat b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 0.82rem; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tab { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 9px 14px; color: var(--muted); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .tools { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .tools input { flex: 1 1 220px; }
  .wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  th { font-weight: 600; font-size: 0.85rem; color: var(--muted); background: var(--bg); position: sticky; top: 0; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: var(--accent-soft); }
  .tag { display: inline-block; padding: 1px 9px; border-radius: 999px; background: var(--accent-soft); font-size: 0.82rem; }
  .err { display: inline-block; padding: 1px 9px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); font-size: 0.82rem; }
  td.raw { white-space: normal; max-width: 460px; }
  details summary { cursor: pointer; color: var(--accent); }
  pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; font-size: 0.8rem; }
  .msg { padding: 28px 18px; color: var(--muted); }
  .msg.error { color: var(--bad); }
  .count { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Invoice Database</h1>
      <div class="sub" id="updated">Not loaded yet</div>
    </div>
    <button id="refresh" type="button">Refresh data</button>
  </header>

  <section class="stats" aria-label="Summary">
    <div class="stat"><b id="s-count">0</b><span>Invoices saved</span></div>
    <div class="stat"><b id="s-total">$0.00</b><span>Total invoiced</span></div>
    <div class="stat"><b id="s-review">0</b><span>Need review</span></div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-inv" aria-selected="true" type="button">Invoices</button>
    <button class="tab" role="tab" id="tab-rev" aria-selected="false" type="button">Needs review</button>
  </div>

  <section id="panel-inv">
    <div class="tools">
      <input id="search" type="search" placeholder="Search vendor or invoice number" aria-label="Search invoices">
      <select id="category" aria-label="Filter by category"><option value="">All categories</option></select>
    </div>
    <div class="wrap">
      <table>
        <thead><tr id="inv-head"></tr></thead>
        <tbody id="inv-body"></tbody>
      </table>
      <div class="msg" id="inv-msg" hidden></div>
    </div>
    <div class="count" id="inv-count"></div>
  </section>

  <section id="panel-rev" hidden>
    <div class="wrap">
      <table>
        <thead><tr><th>ID</th><th>Problem</th><th>What the AI returned</th></tr></thead>
        <tbody id="rev-body"></tbody>
      </table>
      <div class="msg" id="rev-msg" hidden></div>
    </div>
    <div class="count" id="rev-count"></div>
  </section>
</main>

<script>
(function () {
  var invoices = [], review = [];
  var sort = { key: 'id', dir: 1 };
  var cols = [
    { key: 'id', label: 'ID', num: true },
    { key: 'invoiceNumber', label: 'Invoice number' },
    { key: 'vendor', label: 'Vendor' },
    { key: 'invoiceDate', label: 'Date' },
    { key: 'total', label: 'Total', num: true },
    { key: 'category', label: 'Category' }
  ];
  var $ = function (id) { return document.getElementById(id); };
  var money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text !== undefined && text !== null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }

  function buildHead() {
    var tr = $('inv-head'); tr.textContent = '';
    cols.forEach(function (c) {
      var th = el('th', c.label + (sort.key === c.key ? (sort.dir === 1 ? ' \u25B2' : ' \u25BC') : ''), 'sortable' + (c.num ? ' num' : ''));
      th.tabIndex = 0;
      th.setAttribute('role', 'button');
      var go = function () {
        sort = { key: c.key, dir: sort.key === c.key ? -sort.dir : 1 };
        renderInvoices();
      };
      th.addEventListener('click', go);
      th.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
      tr.appendChild(th);
    });
  }

  function renderInvoices() {
    buildHead();
    var q = $('search').value.trim().toLowerCase();
    var cat = $('category').value;
    var rows = invoices.filter(function (r) {
      return (!cat || r.category === cat) &&
        (!q || (r.vendor + ' ' + r.invoiceNumber).toLowerCase().indexOf(q) !== -1);
    });
    rows.sort(function (a, b) {
      var x = a[sort.key], y = b[sort.key];
      if (typeof x === 'number') return (x - y) * sort.dir;
      return String(x).localeCompare(String(y), undefined, { numeric: true }) * sort.dir;
    });
    var body = $('inv-body'); body.textContent = '';
    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.appendChild(el('td', r.id, 'num'));
      tr.appendChild(el('td', r.invoiceNumber));
      tr.appendChild(el('td', r.vendor));
      tr.appendChild(el('td', r.invoiceDate));
      tr.appendChild(el('td', money.format(r.total), 'num'));
      var td = document.createElement('td'); td.appendChild(el('span', r.category, 'tag')); tr.appendChild(td);
      body.appendChild(tr);
    });
    var msg = $('inv-msg');
    msg.hidden = rows.length > 0;
    if (!rows.length) {
      msg.className = 'msg';
      msg.textContent = invoices.length
        ? 'No invoices match your search or filter.'
        : 'No invoices saved yet. Run the n8n workflow, then select Refresh data.';
    }
    $('inv-count').textContent = 'Showing ' + rows.length + ' of ' + invoices.length + ' invoices';
  }

  function renderReview() {
    var body = $('rev-body'); body.textContent = '';
    review.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.appendChild(el('td', r.id));
      var tdE = document.createElement('td'); tdE.appendChild(el('span', r.error || 'unknown', 'err')); tr.appendChild(tdE);
      var tdR = el('td', null, 'raw');
      var d = document.createElement('details');
      d.appendChild(el('summary', 'View output'));
      d.appendChild(el('pre', r.rawOutput || '(empty)'));
      tdR.appendChild(d); tr.appendChild(tdR);
      body.appendChild(tr);
    });
    var msg = $('rev-msg');
    msg.hidden = review.length > 0;
    if (!review.length) { msg.className = 'msg'; msg.textContent = 'Nothing needs review.'; }
    $('rev-count').textContent = review.length + ' flagged ' + (review.length === 1 ? 'item' : 'items');
  }

  function fillCategories() {
    var sel = $('category'), cur = sel.value;
    var cats = Array.from(new Set(invoices.map(function (r) { return r.category; }))).sort();
    sel.textContent = '';
    var all = el('option', 'All categories'); all.value = ''; sel.appendChild(all);
    cats.forEach(function (c) { var o = el('option', c); o.value = c; sel.appendChild(o); });
    sel.value = cats.indexOf(cur) !== -1 ? cur : '';
  }

  function stats() {
    $('s-count').textContent = invoices.length;
    $('s-total').textContent = money.format(invoices.reduce(function (s, r) { return s + r.total; }, 0));
    $('s-review').textContent = review.length;
  }

  function showError(err) {
    ['inv-msg', 'rev-msg'].forEach(function (id) {
      var m = $(id); m.hidden = false; m.className = 'msg error';
      m.textContent = 'Could not load data (' + err.message + '). Check that Docker is running and the database container is up, then select Refresh data.';
    });
    $('inv-body').textContent = ''; $('rev-body').textContent = '';
  }

  function load() {
    $('refresh').disabled = true;
    Promise.all([
      fetch('/api/invoices').then(function (r) { if (!r.ok) throw new Error('invoices ' + r.status); return r.json(); }),
      fetch('/api/review-queue').then(function (r) { if (!r.ok) throw new Error('review queue ' + r.status); return r.json(); })
    ]).then(function (res) {
      invoices = res[0]; review = res[1];
      fillCategories(); stats(); renderInvoices(); renderReview();
      $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    }).catch(showError).then(function () { $('refresh').disabled = false; });
  }

  function selectTab(which) {
    var inv = which === 'inv';
    $('panel-inv').hidden = !inv; $('panel-rev').hidden = inv;
    $('tab-inv').setAttribute('aria-selected', inv);
    $('tab-rev').setAttribute('aria-selected', !inv);
  }

  $('tab-inv').addEventListener('click', function () { selectTab('inv'); });
  $('tab-rev').addEventListener('click', function () { selectTab('rev'); });
  $('search').addEventListener('input', renderInvoices);
  $('category').addEventListener('change', renderInvoices);
  $('refresh').addEventListener('click', load);
  buildHead();
  load();
})();
</script>
</body>
</html>
